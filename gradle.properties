org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=immersive_spellcraft
mod_name=Immersive Spellcraft
mod_version=0.1.0
mod_group=com.otectus.immersivespellcraft
mod_archive=immersive-spellcraft
mod_license=GPL-3.0
mod_authors=Otectus

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
junit_version=5.10.2
junit_platform_version=1.10.2

# Integration targets. All are compileOnly; their runtime copies load only under the -Pwith* run profiles
# (see build.gradle). Supported ranges are enforced at runtime by compat/IntegrationVersions, not by mods.toml.
# Ars Nouveau 4.12.7 (CurseForge file 6688854)
ars_nouveau_project=ars-nouveau-401955
ars_nouveau_file=6688854
# Iron's Spells 'n Spellbooks: 1.20.1-3.16.3 is the primary target (file 8680180); 1.20.1-3.15.0 (file 7402504) is the
# second profile. ForgeGradle cannot deobfuscate two versions of one artifact in one build, so -PironsVersion=315
# selects 3.15.0 for compilation and runtime together.
irons_project=irons-spells-n-spellbooks-855414
irons_316_file=8680180
irons_315_file=7402504
# Ars 'n Spells 3.4.0, built from otectus/ars-n-spells 0da9de067fac60db06f18ba407b266261c65db47, read from libs/
ans_version=3.4.0

# Runtime-only libraries the integration profiles need to boot. GeckoLib 4.8.3 satisfies Ars (>=4.2.1) and both
# Iron's versions (>=4.8 / >=4.8.2); Curios 5.14.1 is Iron's 3.16.3 floor; irons_lib is needed by 3.16.x only.
geckolib_version=4.8.3
curios_version=5.14.1+1.20.1
playeranimator_version=1.0.2-rc1+1.20
irons_lib_version=1.20.1-2.1.0
mixinextras_version=0.5.4
